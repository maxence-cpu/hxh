name: Compiler le mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Installer Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: current

      - name: Trouver les dernières versions de NeoForge (26.3) et ModDevGradle
        run: |
          NEO=$(curl -s https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml \
                | grep -oP '(?<=<version>)26\.3\.[^<]+' | tail -1)
          MDG=$(curl -s https://maven.neoforged.net/releases/net/neoforged/moddev/net.neoforged.moddev.gradle.plugin/maven-metadata.xml \
                | grep -oP '(?<=<release>)[^<]+')
          echo "NeoForge : $NEO / ModDevGradle : $MDG"
          echo "NEO=$NEO" >> "$GITHUB_ENV"
          echo "MDG=$MDG" >> "$GITHUB_ENV"

      - name: Compiler
        run: |
          set -o pipefail
          gradle build -Pneo_version="$NEO" -Pmdg_version="$MDG" --stacktrace 2>&1 | tee build.log

      - name: Envoyer le journal d'erreurs sur la branche ci-logs
        if: failure()
        run: |
          echo "NeoForge $NEO / MDG $MDG / commit $GITHUB_SHA" > /tmp/header.txt
          cat /tmp/header.txt build.log > /tmp/build.log
          bash .github/scripts/api-dump.sh && cp api.txt /tmp/api.txt
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan ci-logs
          git rm -rfq --cached .
          cp /tmp/build.log build.log
          cp /tmp/api.txt api.txt || true
          git add -f build.log api.txt
          git commit -qm "Journal de compilation $GITHUB_RUN_NUMBER"
          git push -f origin ci-logs

      - name: Publier le .jar
        uses: actions/upload-artifact@v4
        with:
          name: hxh-nen-jar
          path: build/libs/*.jar

      - name: Créer une release téléchargeable
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: HxH Nen — build ${{ github.run_number }}
          body: Compilé automatiquement depuis ${{ github.sha }}. Mets le .jar dans le dossier mods de ton instance NeoForge 26.3.
          prerelease: true
          files: build/libs/*.jar
